name: Update portfolio API assets

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update site settings, NASA data and logo assets
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          LOGO_API_KEY: ${{ secrets.LOGO_API_KEY }}
          SHOW_AVAILABLE_FOR_ROLES: ${{ vars.SHOW_AVAILABLE_FOR_ROLES }}
        run: |
          node <<'NODE'
          const fs = require('fs/promises');
          const path = require('path');

          const apodFile = path.join('data', 'apod.json');
          const siteConfigFile = path.join('data', 'site-config.json');
          const fallbackApod = {
            source: 'fallback',
            updated: new Date().toISOString(),
            items: []
          };

          const logos = [
            { id: 'microsoft', domain: 'microsoft.com' },
            { id: 'vmware', domain: 'vmware.com' },
            { id: 'servicenow', domain: 'servicenow.com' },
            { id: 'tcs', domain: 'tcs.com' },
            { id: 'ltimindtree', domain: 'ltimindtree.com' },
            { id: 'connectwise', domain: 'connectwise.com' },
            { id: 'capgemini', domain: 'capgemini.com' },
            { id: 'exidelife', domain: 'exidelife.in' },
            { id: 'bayer', domain: 'bayer.com' }
          ];

          async function ensureDir(dir) {
            await fs.mkdir(dir, { recursive: true });
          }

          async function readJson(file, fallback) {
            try {
              return JSON.parse(await fs.readFile(file, 'utf8'));
            } catch {
              return fallback;
            }
          }

          async function updateApod() {
            await ensureDir('data');
            const existing = await readJson(apodFile, fallbackApod);

            if (!process.env.NASA_API_KEY) {
              console.log('NASA_API_KEY is not set; keeping existing APOD data.');
              if (!existing.items) {
                await fs.writeFile(apodFile, JSON.stringify(fallbackApod, null, 2) + '\n');
              }
              return;
            }

            try {
              const params = new URLSearchParams({
                api_key: process.env.NASA_API_KEY,
                count: '5',
                thumbs: 'true'
              });
              const response = await fetch(`https://api.nasa.gov/planetary/apod?${params}`, {
                headers: { 'User-Agent': 'portfolio-assets-action' }
              });
              if (!response.ok) throw new Error(`NASA APOD returned ${response.status}`);

              const raw = await response.json();
              const items = (Array.isArray(raw) ? raw : [raw])
                .filter(item => item && item.media_type === 'image' && item.url)
                .slice(0, 5)
                .map(item => ({
                  title: item.title || 'NASA Astronomy Picture of the Day',
                  date: item.date || '',
                  media_type: item.media_type,
                  url: item.url,
                  hdurl: item.hdurl || '',
                  explanation: item.explanation || '',
                  copyright: item.copyright || ''
                }));

              if (!items.length) throw new Error('NASA APOD returned no image items');

              await fs.writeFile(apodFile, JSON.stringify({
                source: 'nasa-apod',
                updated: new Date().toISOString(),
                items
              }, null, 2) + '\n');
              console.log(`Wrote ${items.length} NASA APOD image item(s).`);
            } catch (error) {
              console.warn(`NASA APOD update failed: ${error.message}`);
              if (!existing.items) {
                await fs.writeFile(apodFile, JSON.stringify(fallbackApod, null, 2) + '\n');
              }
            }
          }

          async function updateSiteConfig() {
            await ensureDir('data');
            const showAvailableForRoles =
              String(process.env.SHOW_AVAILABLE_FOR_ROLES || '').toLowerCase() === 'true';
            await fs.writeFile(siteConfigFile, JSON.stringify({
              showAvailableForRoles
            }, null, 2) + '\n');
            console.log(`Availability badge is ${showAvailableForRoles ? 'shown' : 'hidden'}.`);
          }

          async function updateLogos() {
            await ensureDir(path.join('assets', 'logos'));

            if (!process.env.LOGO_API_KEY) {
              console.log('LOGO_API_KEY is not set; keeping existing logo assets.');
              return;
            }

            for (const logo of logos) {
              const params = new URLSearchParams({
                token: process.env.LOGO_API_KEY,
                size: '128',
                format: 'png',
                retina: 'true',
                theme: 'auto',
                fallback: '404'
              });
              const url = `https://img.logo.dev/${logo.domain}?${params}`;
              const output = path.join('assets', 'logos', `${logo.id}.png`);

              try {
                const response = await fetch(url, {
                  headers: { 'User-Agent': 'portfolio-assets-action' }
                });
                if (!response.ok) throw new Error(`Logo.dev returned ${response.status}`);

                const contentType = response.headers.get('content-type') || '';
                if (!contentType.startsWith('image/')) {
                  throw new Error(`Unexpected content type: ${contentType || 'unknown'}`);
                }

                const buffer = Buffer.from(await response.arrayBuffer());
                if (buffer.length < 100) throw new Error('Logo response was too small');

                await fs.writeFile(output, buffer);
                console.log(`Updated ${output}`);
              } catch (error) {
                console.warn(`Logo update failed for ${logo.domain}: ${error.message}`);
              }
            }
          }

          (async () => {
            await updateSiteConfig();
            await updateApod();
            await updateLogos();
          })().catch(error => {
            console.error(`Portfolio asset update failed: ${error.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apod.json data/site-config.json assets/logos
          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "Update portfolio API assets"
            git push
          fi
